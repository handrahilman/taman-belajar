<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF7F2">
<title>Taman Belajar</title>
<style>
:root{
  --ink:#3D4A63;
  --p-rose:#FFD4E0;--p-peach:#FFE0C7;--p-lemon:#FFF3C4;--p-mint:#CFF0DF;--p-sky:#CFE6FA;--p-lilac:#E2D8FB;
  --strawberry:#FF8FA8;--sun:#FFD466;--sky:#7EC4EF;--leaf:#7FD6A6;--grape:#B69BEF;
  --tangerine:#FFAE73;--bubble:#8FD8E0;--rose:#F5A3C7;--moss:#9FCF7A;--clay:#E39B8A;--sand:#E8C98F;
  --shadow:0 9px 0 rgba(61,74,99,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Baloo 2","Comic Sans MS","Segoe UI Rounded",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 12%, rgba(255,212,224,.55), transparent 44%),
    radial-gradient(circle at 90% 88%, rgba(207,230,250,.6), transparent 46%),
    #FBF7F2;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
#bar.hidden{display:none}
.iconbtn{position:relative;overflow:hidden;border:0;border-radius:22px;background:var(--p-rose);color:var(--ink);box-shadow:0 5px 0 rgba(61,74,99,.18);width:74px;height:58px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:30px;touch-action:none}
.iconbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.75);transition:width .18s ease}
.iconbtn.holding .fill{width:100%;transition:width 1s linear}
.iconbtn span{position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,74,99,.18)}
#dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;background:rgba(61,74,99,.15)}
.dot.on{background:var(--sun);box-shadow:0 0 0 3px rgba(255,212,102,.35)}
#scorepill{background:var(--p-lemon);border-radius:22px;box-shadow:0 5px 0 rgba(61,74,99,.18);padding:12px 18px;font-size:22px;font-weight:900;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:800;font-size:17px;padding:14px 24px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:70;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#stage{flex:1;position:relative;display:flex;flex-direction:column;padding:0 16px 18px;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;animation:fadeUp .45s ease both;min-height:0}
.screen.leaving{animation:fadeOut .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-14px) scale(.99)}}

.brand{text-align:center;padding:6px 0 6px}
.brand h1{margin:0;font-weight:900;line-height:1.02;letter-spacing:2px;font-size:clamp(32px,7.4vw,62px);
  background:linear-gradient(100deg,#FFC9DC 0%,#FFE0BE 26%,#FFF6C9 46%,#CDEFDD 64%,#CDE5FA 82%,#E1D6FB 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px #8E9BB5;paint-order:stroke fill;filter:drop-shadow(0 4px 0 rgba(142,155,181,.35))}
.subtitle{display:inline-block;margin:10px auto 0;background:var(--p-lilac);color:var(--ink);border-radius:999px;padding:8px 20px;font-size:clamp(13px,2.3vw,18px);font-weight:900;box-shadow:0 4px 0 rgba(61,74,99,.16)}
.scroller{flex:1;overflow-y:auto;padding-bottom:8px}
.sect{margin:14px 0 8px;font-size:clamp(15px,2.5vw,20px);font-weight:900;display:flex;align-items:center;gap:10px;color:#6C7A94}
.sect::after{content:"";flex:1;height:4px;border-radius:4px;background:rgba(108,122,148,.16)}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.card{border:0;border-radius:26px;color:var(--ink);cursor:pointer;min-height:112px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow);transition:transform .12s ease;font-family:inherit}
.card:active{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 rgba(61,74,99,.16)}
.card .em{font-size:clamp(30px,5.8vw,46px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.10))}
.card .em svg{width:1em;height:1em;vertical-align:middle}
.card .nm{font-size:clamp(13px,2.1vw,17px);font-weight:900;text-align:center;line-height:1.15}
.tip{margin:12px auto 4px;background:var(--p-mint);color:var(--ink);border-radius:20px;padding:12px 20px;text-align:center;font-size:clamp(13px,2.1vw,17px);font-weight:800;line-height:1.4;box-shadow:0 4px 0 rgba(61,74,99,.16);max-width:760px}

.prompt{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 20px;margin:2px 0 14px;text-align:center;font-size:clamp(19px,3.7vw,32px);font-weight:900;line-height:1.25}
.prompt .say{color:#E77BA0}
.prompt .hero{font-size:clamp(44px,8.6vw,80px);line-height:1.1;display:block;margin-bottom:4px}
.prompt .hero svg{width:1em;height:1em}
.answers{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;align-content:center;min-height:0}
.opt{border:0;background:#fff;border-radius:30px;box-shadow:var(--shadow);cursor:pointer;width:clamp(112px,22vw,186px);height:clamp(112px,22vw,186px);display:grid;place-items:center;font-size:clamp(46px,10vw,86px);transition:transform .12s ease;padding:0;font-family:inherit;color:var(--ink)}
.opt:active{transform:translateY(5px) scale(.96)}
.opt svg{width:74%;height:74%}
.opt.stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.opt.stack svg{width:58%;height:58%}
.opt .lbl{font-size:clamp(13px,2.2vw,19px);font-weight:900;margin-top:4px}
.opt.four{width:clamp(96px,19vw,160px);height:clamp(96px,19vw,160px);font-size:clamp(40px,8.4vw,74px)}
.opt.letter{font-size:clamp(56px,12vw,110px);font-weight:900}
.swatch{border-radius:50%;width:clamp(112px,22vw,182px);height:clamp(112px,22vw,182px);box-shadow:var(--shadow)}
.swatch.edge{border:5px solid #DDE3EC}
.wobble{animation:wob .45s ease}
@keyframes wob{0%,100%{transform:none}20%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.float{animation:flt 2.6s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tray{background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:14px}
.tray span{font-size:clamp(40px,8.5vw,76px);line-height:1}
.earbtn{border:0;border-radius:999px;background:var(--p-sky);color:var(--ink);font-family:inherit;font-weight:900;font-size:clamp(16px,2.7vw,22px);padding:13px 26px;box-shadow:var(--shadow);cursor:pointer}
.earbtn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(61,74,99,.16)}

.matchwrap{flex:1;display:flex;gap:16px;align-items:center;justify-content:center;min-height:0}
.col{display:flex;flex-direction:column;gap:14px}
.mitem{border:0;background:#fff;border-radius:26px;box-shadow:var(--shadow);width:clamp(94px,18vw,148px);height:clamp(94px,18vw,148px);font-size:clamp(44px,9vw,78px);display:grid;place-items:center;cursor:pointer;font-family:inherit}
.mitem.sel{outline:6px solid var(--sun);transform:scale(1.05)}
.mitem.done{background:var(--p-mint);opacity:.55;pointer-events:none}

.pzwrap{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0;padding:6px 0 4px}
.pztray{width:100%;display:flex;align-items:center;justify-content:center;min-height:clamp(80px,17vw,132px)}
.pzhint{font-size:clamp(24px,4.6vw,38px);opacity:.45;animation:down 1.6s ease-in-out infinite}
@keyframes down{0%,100%{transform:translateY(-4px)}50%{transform:translateY(8px)}}
.slots{display:grid;gap:8px;background:#fff;padding:10px;border-radius:26px;box-shadow:var(--shadow)}
.slot{border-radius:14px;background:rgba(61,74,99,.06);position:relative;overflow:hidden}
.slot.ready{background:rgba(255,212,102,.45)}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.ptile{position:absolute;border-radius:14px;overflow:hidden;background:#fff;line-height:0;box-shadow:var(--shadow);touch-action:none;cursor:grab}
.ptile.moving{transition:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 14px 0 rgba(61,74,99,.18);z-index:20}
.ptile.gliding{transition:left .28s cubic-bezier(.3,1.3,.5,1), top .28s cubic-bezier(.3,1.3,.5,1)}
.ptile.locked{box-shadow:none}
.ptile canvas{display:block;width:100%;height:100%}

.dgitem{position:absolute;border-radius:28px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;touch-action:none;cursor:grab;z-index:10;font-size:clamp(44px,9vw,80px)}
.dgitem svg{width:76%;height:76%}
.dgitem.moving{transform:scale(1.1) rotate(-3deg);box-shadow:0 14px 0 rgba(61,74,99,.18);z-index:30}
.dgitem.gliding{transition:left .28s cubic-bezier(.3,1.3,.5,1), top .28s cubic-bezier(.3,1.3,.5,1)}
.zones{display:flex;gap:12px;justify-content:center;align-items:flex-end;width:100%;flex-wrap:wrap}
.zone{border-radius:26px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;width:clamp(96px,20vw,160px);height:clamp(96px,20vw,160px);font-size:clamp(38px,8vw,70px)}
.zone svg{width:1em;height:1em;display:block}
.zone .shd{filter:brightness(0) saturate(0);opacity:.34;display:inline-block}
.zone .zl{font-size:clamp(12px,2vw,17px);font-weight:900;line-height:1.1;text-align:center}
.zone.ready{outline:6px solid var(--sun);transform:scale(1.04)}
.zone.full{opacity:.5}

.board{flex:1;background:#fff;border-radius:32px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:0}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.figure{flex:1;display:grid;place-items:center;min-height:0;background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:10px;position:relative}
.figure svg{height:100%;max-height:100%;width:auto;display:block}
.figure .hit{cursor:pointer}
.palette{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pchip{width:clamp(46px,8vw,66px);height:clamp(46px,8vw,66px);border-radius:50%;border:0;box-shadow:var(--shadow);cursor:pointer}
.pchip.sel{outline:5px solid var(--ink);transform:scale(1.08)}

.bub{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.bub .sk{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 22px rgba(255,255,255,.7), 0 4px 0 rgba(61,74,99,.10)}
.bub .ic{position:relative;font-size:.5em}
.bub.gone{animation:bpop .3s ease forwards}
@keyframes bpop{to{transform:scale(1.6);opacity:0}}

.action{border:0;border-radius:24px;background:var(--leaf);color:var(--ink);font-weight:900;font-size:clamp(17px,2.8vw,24px);padding:15px 28px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.action.alt{background:var(--p-sky)}
.action:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(61,74,99,.16)}
.rowbtns{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.finish .trophy{font-size:clamp(84px,20vw,168px)}
.finish h2{font-size:clamp(26px,5.6vw,46px);margin:0;font-weight:900;background:linear-gradient(100deg,#FFC9DC,#CDE5FA,#E1D6FB);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #8E9BB5;paint-order:stroke fill}
.finish .stars{font-size:clamp(24px,5.4vw,42px);letter-spacing:4px;line-height:1.5;max-width:90vw}

.burst{position:fixed;pointer-events:none;font-size:36px;z-index:60;animation:fly .9s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
#flash{position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,0);z-index:50}
#flash.on{animation:fl .5s ease}
@keyframes fl{0%{background:rgba(255,255,255,.5)}100%{background:rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar" class="hidden">
    <button class="iconbtn" id="home" type="button" aria-label="Tahan satu detik untuk kembali ke menu">
      <span class="fill"></span><span>🏠</span>
    </button>
    <div id="dots"></div>
    <div id="scorepill">⭐ <span id="score">0</span></div>
  </div>
  <div id="stage"></div>
</div>
<div id="flash"></div>
<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   Taman Belajar v7
   - Semua kalimat perintah memakai pola SPOK (Subjek-Predikat-Objek-Keterangan)
   - Ikon penting digambar SVG agar tampil sama di Android & iOS
   ========================================================= */
const stage=document.getElementById('stage'),bar=document.getElementById('bar');
const dotsEl=document.getElementById('dots'),scoreEl=document.getElementById('score');
const flash=document.getElementById('flash'),toastEl=document.getElementById('toast');

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const sample=(a,n)=>shuffle(a).slice(0,n);
const pick10=a=>shuffle(a).slice(0,10);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

const N_OPT=3,STEPS=10,TRACE_NEED=.80,SCRUB_NEED=.70,GAP=2000,SAYPROMPT=560;

let toastT=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200);}

/* ---------- AUDIO ---------- */
let actx=null;
function ac(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}
function tone(f,dur,delay=0,type='sine',vol=.22){
  const c=ac();if(!c)return;
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
function glide(f0,f1,dur,delay=0,type='sine',vol=.2){
  const c=ac();if(!c)return;
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(40,f0),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.06,dur*.25));
  g.gain.setValueAtTime(vol,t+dur*.65);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
const sndGood=()=>{[660,880,1100,1320].forEach((f,i)=>tone(f,.28,i*.08,'triangle',.2));tone(1760,.2,.34,'sine',.12);};
const sndTry=()=>{tone(360,.16,0,'sine',.13);tone(300,.2,.1,'sine',.12);};
const sndTap=()=>tone(760,.08,0,'triangle',.12);
const sndSnap=()=>{tone(620,.08,0,'square',.12);tone(990,.13,.05,'triangle',.16);};
const sndPop=()=>{tone(1250,.05,0,'square',.15);tone(520,.11,.03,'triangle',.13);};
const sndFinish=()=>[660,784,880,1047,1175,1320,1568].forEach((f,i)=>tone(f,.36,i*.1,'triangle',.19));

/* ---------- SUARA BICARA ---------- */
let voiceObj=null,ttsOn=('speechSynthesis' in window);
function pickVoice(){
  if(!ttsOn)return;
  const v=speechSynthesis.getVoices();
  const id=v.filter(x=>/^id/i.test(x.lang));
  const ms=v.filter(x=>/^ms/i.test(x.lang));
  const pool=id.length?id:ms;
  voiceObj = pool.find(x=>/female|wanita|perempuan|damayanti|google/i.test(x.name)) || pool[0] || null;
}
if(ttsOn){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){
  if(!ttsOn)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID';u.rate=.92;u.pitch=1.5;
    if(voiceObj)u.voice=voiceObj;
    speechSynthesis.speak(u);
  }catch(e){}
}
let sayT=null;
function speakSoon(text,delay=SAYPROMPT){clearTimeout(sayT);sayT=setTimeout(()=>say(text),delay);}

const PRAISE=['Hebat!','Pintar!','Bagus sekali!','Yeay, benar!','Keren!','Kamu bisa!'];
function burst(x,y){
  const ch=['⭐','✨','🌟','💫','🎉'];
  for(let i=0;i<10;i++){
    const s=el('div','burst',rnd(ch));
    const a=Math.random()*Math.PI*2,d=90+Math.random()*140;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');s.style.setProperty('--dy',(Math.sin(a)*d-40)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);
  }
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
}
function burstAt(n){const r=n.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);}

/* =========================================================
   IKON SVG
   ========================================================= */
const K='#3D4A63';
function svg(inner){return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}
const ICON={
  balon:c=>svg(`<ellipse cx="50" cy="40" rx="28" ry="33" fill="${c}" stroke="${K}" stroke-width="3"/><ellipse cx="41" cy="30" rx="7" ry="10" fill="#fff" opacity=".5"/><path d="M46 72h8l-4 7z" fill="${c}" stroke="${K}" stroke-width="2"/><path d="M50 79q7 9 0 17" stroke="#8792A8" stroke-width="2.5" fill="none"/>`),
  sepatu:c=>svg(`<path d="M14 58q0-6 6-6h20l10 8q18 2 30 12q6 4 6 10v2q0 4-5 4H18q-4 0-4-5z" fill="${c}" stroke="${K}" stroke-width="3"/><path d="M14 76H84" stroke="${K}" stroke-width="3"/><path d="M40 52l9 8M50 54l8 8" stroke="${K}" stroke-width="2"/>`),
  bola:c=>svg(`<circle cx="50" cy="52" r="34" fill="${c}" stroke="${K}" stroke-width="3"/><path d="M22 42q28-10 56 0M20 62q30 10 60 0M50 18v68" stroke="#fff" stroke-width="4" fill="none" opacity=".85"/>`),
  topi:c=>svg(`<path d="M22 62q28-46 56 0z" fill="${c}" stroke="${K}" stroke-width="3"/><path d="M76 62q16 0 18 8q0 4-6 4H74z" fill="${c}" stroke="${K}" stroke-width="3"/><circle cx="50" cy="22" r="4" fill="${K}"/>`),

const Game={
  act:null,queue:[],round:0,total:STEPS,stars:0,locked:false,timer:null,cleans:[],
  clean(){this.cleans.forEach(f=>{try{f();}catch(e){}});this.cleans=[];},
  onClean(f){this.cleans.push(f);},
  open(a){this.clean();this.act=a;this.queue=a.plan();this.total=this.queue.length;this.round=0;this.stars=0;bar.classList.remove('hidden');scoreEl.textContent='0';this.next();},
  dots(){dotsEl.innerHTML='';for(let i=0;i<this.total;i++)dotsEl.appendChild(el('div','dot'+(i<this.round?' on':'')));},
  next(){
    this.clean();this.locked=false;this.dots();
    if(this.round>=this.total){this.finish();return;}
    stage.innerHTML='';
    const s=el('div','screen');stage.appendChild(s);
    this.act.build(s,this.queue[this.round],this.round);
  },
  transition(){
    const cur=stage.firstChild;
    if(cur)cur.classList.add('leaving');
    this.timer=setTimeout(()=>this.next(),300);
  },
  win(node,words){
    if(this.locked)return;this.locked=true;
    if(node){node.classList.add('pop');burstAt(node);}
    sndGood();say(words||rnd(PRAISE));
    this.stars++;this.round++;scoreEl.textContent=this.stars;
    this.timer=setTimeout(()=>this.transition(),GAP);
  },
  wrong(node,hint){
    if(this.locked)return;
    if(node){node.classList.remove('wobble');void node.offsetWidth;node.classList.add('wobble');}
    sndTry();if(hint)say(hint);
  },
  advance(){this.win(null);},
  finish(){
    this.clean();stage.innerHTML='';
    const s=el('div','screen'),f=el('div','finish');
    f.appendChild(el('div','trophy float','🏆'));
    f.appendChild(el('h2',null,'Selesai! Kamu hebat!'));
    f.appendChild(el('div','stars','⭐'.repeat(Math.max(1,this.stars))));
    const row=el('div','rowbtns');
    const again=el('button','action','Main lagi');again.type='button';again.onclick=()=>{sndTap();this.open(this.act);};
    const menu=el('button','action alt','Menu');menu.type='button';menu.onclick=()=>{sndTap();goHome();};
    row.append(again,menu);f.appendChild(row);s.appendChild(f);stage.appendChild(s);
    sndFinish();say('Hore! Selesai. Kamu hebat!');
    const cx=innerWidth/2,cy=innerHeight/2;
    for(let i=0;i<4;i++)setTimeout(()=>burst(cx+(Math.random()-.5)*260,cy+(Math.random()-.5)*200),i*260);
  }
};

function makeDrag(cfg){
  return {id:cfg.id,name:cfg.name,emoji:cfg.emoji,bg:cfg.bg,
    plan:cfg.plan||(()=>shuffle(cfg.data).slice(0,STEPS)),
    build(scr,item){
      const s=cfg.scene(item);
      const p=el('div','prompt');p.innerHTML=s.html;
      const wrap=el('div','pzwrap'),tray=el('div','pztray'),hint=el('div','pzhint','⬇️'),zones=el('div','zones');
      wrap.append(tray,hint,zones);scr.append(p,wrap);
      speakSoon(s.say);p.onclick=()=>say(s.say);
      const zEls=shuffle(s.zones).map(z=>{
        const d=el('div','zone');d.dataset.ok=z.ok?'1':'';
        d.innerHTML='<div>'+z.e+'</div>'+(z.n?'<div class="zl">'+z.n+'</div>':'');
        if(z.bg)d.style.background=z.bg;zones.appendChild(d);return d;
      });
      const it=el('div','dgitem');
      if(s.item.icon)it.appendChild(iconEl(s.item.icon,s.item.color));else it.textContent=s.item.e;
      wrap.appendChild(it);
      function layout(){
        const wr=wrap.getBoundingClientRect();
        const SZ=Math.max(70,Math.min(130,Math.floor(Math.min(wr.width*.26,wr.height*.26))));
        it.style.width=SZ+'px';it.style.height=SZ+'px';
        const tr=tray.getBoundingClientRect();
        it.dataset.hx=(wr.width-SZ)/2;it.dataset.hy=(tr.top-wr.top)+Math.max(0,(tr.height-SZ)/2);
        if(!it.dataset.locked){it.style.left=it.dataset.hx+'px';it.style.top=it.dataset.hy+'px';}
      }
      let drag=null;
      function near(){
        const r=it.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
        let best=null,bd=1e9;
        zEls.forEach(d=>{const s2=d.getBoundingClientRect();const dist=Math.hypot(s2.left+s2.width/2-cx,s2.top+s2.height/2-cy);if(dist<bd){bd=dist;best=d;}});
        return bd<r.width*1.3?best:null;
      }
      it.addEventListener('pointerdown',e=>{
        if(it.dataset.locked||drag)return;it.setPointerCapture(e.pointerId);
        const wr=wrap.getBoundingClientRect();
        drag={id:e.pointerId,ox:e.clientX-(wr.left+parseFloat(it.style.left)),oy:e.clientY-(wr.top+parseFloat(it.style.top)),wr};
        it.classList.add('moving');it.classList.remove('gliding');sndTap();
      });
      it.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.id)return;
        it.style.left=(e.clientX-drag.wr.left-drag.ox)+'px';it.style.top=(e.clientY-drag.wr.top-drag.oy)+'px';
        const n=near();zEls.forEach(d=>d.classList.toggle('ready',n===d));
      });
      function up(e){
        if(!drag||(e&&e.pointerId!==drag.id))return;
        const wr=drag.wr;drag=null;it.classList.remove('moving');it.classList.add('gliding');
        const n=near();zEls.forEach(d=>d.classList.remove('ready'));
        if(n&&n.dataset.ok==='1'){
          const d=n.getBoundingClientRect();
          it.style.left=(d.left-wr.left+(d.width-it.offsetWidth)/2)+'px';
          it.style.top=(d.top-wr.top+(d.height-it.offsetHeight)/2)+'px';
          it.dataset.locked='1';n.classList.add('full');hint.remove();
          sndSnap();burstAt(it);setTimeout(()=>Game.win(null,s.win),350);
        }else{it.style.left=it.dataset.hx+'px';it.style.top=it.dataset.hy+'px';if(n)Game.wrong(n,s.hint||'Coba lagi ya');else sndTry();}
      }
      it.addEventListener('pointerup',up);it.addEventListener('pointercancel',up);
      requestAnimationFrame(()=>{layout();requestAnimationFrame(layout);});
      window.addEventListener('resize',layout);Game.onClean(()=>window.removeEventListener('resize',layout));
    }};
}
/* PABRIK usap: 70% terbuka = langkah selesai */
function makeScrub(cfg){
  return {id:cfg.id,name:cfg.name,emoji:cfg.emoji,bg:cfg.bg,
    plan:()=>shuffle(cfg.data).slice(0,STEPS),
    build(scr,item){
      const p=el('div','prompt');p.innerHTML=item.t;
      const board=el('div','board'),base=el('canvas'),cover=el('canvas');
      board.append(base,cover);scr.append(p,board);
      speakSoon(item.t);p.onclick=()=>say(item.t);
      let W,H,bx,cx2,dpr=Math.min(2,devicePixelRatio||1),cleared=false;
      function setup(){
        const r=board.getBoundingClientRect();W=r.width;H=r.height;
        [base,cover].forEach(c=>{c.width=W*dpr;c.height=H*dpr;});
        bx=base.getContext('2d');cx2=cover.getContext('2d');
        bx.setTransform(dpr,0,0,dpr,0,0);cx2.setTransform(dpr,0,0,dpr,0,0);
        bx.clearRect(0,0,W,H);
        bx.font=Math.floor(Math.min(W,H)*.55)+'px serif';bx.textAlign='center';bx.textBaseline='middle';
        bx.fillText(item.pic,W/2,H/2);
        cx2.clearRect(0,0,W,H);cx2.fillStyle=item.cover;cx2.fillRect(0,0,W,H);
        cx2.fillStyle='rgba(0,0,0,.10)';
        for(let i=0;i<70;i++){cx2.beginPath();cx2.arc(Math.random()*W,Math.random()*H,4+Math.random()*14,0,7);cx2.fill();}
        cx2.globalCompositeOperation='destination-out';
      }
      /* hitung hanya area GAMBAR yang sudah terbuka, bukan seluruh papan */
      let picBox=null;
      function box(){
        if(picBox)return picBox;
        const s=Math.min(W,H)*.55;
        picBox={x:W/2-s/2,y:H/2-s/2,w:s,h:s};
        return picBox;
      }
      function fracCleared(){
        try{
          const b=box(),g=28,d=cx2.getImageData(0,0,cover.width,cover.height).data;
          let empty=0,tot=0;
          for(let y=0;y<g;y++)for(let x=0;x<g;x++){
            const px=Math.floor((b.x+(x+.5)/g*b.w)*dpr),py=Math.floor((b.y+(y+.5)/g*b.h)*dpr);
            if(px<0||py<0||px>=cover.width||py>=cover.height)continue;
            const a=d[(py*cover.width+px)*4+3];tot++;if(a<40)empty++;
          }
          return tot?empty/tot:0;
        }catch(e){return 0;}
      }
      function done(){
        if(cleared)return;cleared=true;
        cx2.globalCompositeOperation='source-over';cx2.clearRect(0,0,W,H);
        burst(innerWidth/2,innerHeight/2);
        setTimeout(()=>Game.win(null,cfg.winWord(item)),350);
      }
      let down=false,moves=0;
      const pos=e=>{const r=cover.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
      function rub(q){
        const R=Math.max(36,W*.08);
        cx2.beginPath();cx2.arc(q.x,q.y,R,0,7);cx2.fill();
        if(++moves%4===0)tone(300+Math.random()*260,.05,0,'sine',.05);
        if(moves%3===0&&fracCleared()>=SCRUB_NEED)done();
      }
      cover.addEventListener('pointerdown',e=>{cover.setPointerCapture(e.pointerId);down=true;rub(pos(e));});
      cover.addEventListener('pointermove',e=>{if(down)rub(pos(e));});
      const stop=()=>{down=false;if(fracCleared()>=SCRUB_NEED)done();};
      cover.addEventListener('pointerup',stop);cover.addEventListener('pointercancel',stop);
      requestAnimationFrame(setup);
    }};
}

const gPuzzle={id:'puzzle',name:'Susun Puzzle',emoji:'🧩',bg:'var(--sun)',
  plan:()=>shuffle(PUZZLE_PICS),
  build(scr,pic){
    const n=4,cols=2,rows=2;
    const p=el('div','prompt');p.innerHTML='Geser potongan ke <span class="say">bayangannya</span>';
    const wrap=el('div','pzwrap'),tray=el('div','pztray'),hint=el('div','pzhint','⬇️'),slots=el('div','slots');
    slots.style.gridTemplateColumns='repeat('+cols+',1fr)';wrap.append(tray,hint,slots);scr.append(p,wrap);
    speakSoon('Geser ke bayangannya');
    const S=320;
    const mk=w=>{const c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');if(w){x.fillStyle='#fff';x.fillRect(0,0,S,S);}x.font=Math.floor(S*.82)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(pic,S/2,S/2+S*.04);return c;};
    const src=mk(true),ghost=mk(false),sw=S/cols,sh=S/rows;
    let TS=100,tiles=[],slotEls=[],placed=0;
    for(let i=0;i<n;i++){const d=el('div','slot');d.dataset.i=i;const gc=document.createElement('canvas');gc.width=160;gc.height=160;gc.getContext('2d').drawImage(ghost,(i%cols)*sw,Math.floor(i/cols)*sh,sw,sh,0,0,160,160);d.appendChild(gc);slots.appendChild(d);slotEls.push(d);}
    shuffle([...Array(n).keys()]).forEach(i=>{const b=el('div','ptile');b.dataset.i=i;const c=document.createElement('canvas');c.width=160;c.height=160;c.getContext('2d').drawImage(src,(i%cols)*sw,Math.floor(i/cols)*sh,sw,sh,0,0,160,160);b.appendChild(c);wrap.appendChild(b);tiles.push(b);});
    function layout(){
      const wr=wrap.getBoundingClientRect();
      TS=Math.max(62,Math.min(116,Math.floor(Math.min(wr.width/5.4,wr.height*.25))));
      slotEls.forEach(d=>{d.style.width=TS+'px';d.style.height=TS+'px';});
      const trayR=tray.getBoundingClientRect();const free=tiles.filter(t=>!t.dataset.locked);
      const gap=13,totalW=free.length*TS+(free.length-1)*gap;let x=(wr.width-totalW)/2;
      free.forEach(t=>{t.style.width=TS+'px';t.style.height=TS+'px';t.dataset.hx=x;t.dataset.hy=(trayR.top-wr.top)+Math.max(0,(trayR.height-TS)/2);t.style.left=t.dataset.hx+'px';t.style.top=t.dataset.hy+'px';x+=TS+gap;});
      tiles.filter(t=>t.dataset.locked).forEach(t=>{const d=slotEls[+t.dataset.i].getBoundingClientRect();t.style.width=TS+'px';t.style.height=TS+'px';t.style.left=(d.left-wr.left)+'px';t.style.top=(d.top-wr.top)+'px';});
    }
    let drag=null;
    function nearest(t){const r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;slotEls.forEach((d,i)=>{if(d.dataset.full)return;const s=d.getBoundingClientRect();const dist=Math.hypot(s.left+s.width/2-cx,s.top+s.height/2-cy);if(dist<bd){bd=dist;best=i;}});return bd<TS*1.15?best:null;}
    function up(e){
      if(!drag||(e&&e.pointerId!==drag.id))return;
      const {t,wr}=drag;drag=null;t.classList.remove('moving');t.classList.add('gliding');slotEls.forEach(d=>d.classList.remove('ready'));
      const near=nearest(t),mine=+t.dataset.i;
      if(near===mine){const d=slotEls[mine].getBoundingClientRect();t.style.left=(d.left-wr.left)+'px';t.style.top=(d.top-wr.top)+'px';t.dataset.locked='1';t.classList.add('locked');slotEls[mine].dataset.full='1';sndSnap();burstAt(t);placed++;setTimeout(layout,320);if(placed===n){hint.remove();setTimeout(()=>Game.advance(),450);}}
      else{t.style.left=t.dataset.hx+'px';t.style.top=t.dataset.hy+'px';sndTry();say('Cari bayangan yang sama');}
    }
    tiles.forEach(t=>{
      t.addEventListener('pointerdown',e=>{if(t.dataset.locked||drag)return;t.setPointerCapture(e.pointerId);const wr=wrap.getBoundingClientRect();drag={t,id:e.pointerId,ox:e.clientX-(wr.left+parseFloat(t.style.left)),oy:e.clientY-(wr.top+parseFloat(t.style.top)),wr};t.classList.add('moving');t.classList.remove('gliding');sndTap();});
      t.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;t.style.left=(e.clientX-drag.wr.left-drag.ox)+'px';t.style.top=(e.clientY-drag.wr.top-drag.oy)+'px';const near=nearest(t);slotEls.forEach((d,i)=>d.classList.toggle('ready',near!=null&&i===near));});
      t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
    });
    requestAnimationFrame(()=>{layout();requestAnimationFrame(layout);});
    window.addEventListener('resize',layout);Game.onClean(()=>window.removeEventListener('resize',layout));
  }};
const gMatch={id:'cocok',name:'Cari Pasangan',emoji:'🔗',bg:'var(--moss)',
  plan:()=>shuffle(MATCH_SETS),
  build(scr,set){
    const p=el('div','prompt');p.innerHTML='Cocokkan gambar yang <span class="say">sama</span>';
    const wrap=el('div','matchwrap'),left=el('div','col'),right=el('div','col');wrap.append(left,right);scr.append(p,wrap);
    speakSoon('Cocokkan gambar yang sama');
    let sel=null,done=0;
    function tap(b){
      sndTap();
      if(!sel){sel=b;b.classList.add('sel');return;}
      if(sel===b){sel=null;b.classList.remove('sel');return;}
      if(sel.dataset.side===b.dataset.side){sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}
      if(sel.dataset.e===b.dataset.e){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');tone(780,.15,0,'triangle',.16);burstAt(b);sel=null;done++;if(done===set.length)setTimeout(()=>Game.advance(),400);}
      else Game.wrong(b,'Belum sama, coba lagi');
    }
    const make=(e,col,side)=>{const b=el('button','mitem',e);b.type='button';b.dataset.e=e;b.dataset.side=side;b.onclick=()=>tap(b);col.appendChild(b);};
    shuffle(set).forEach(e=>make(e,left,'L'));shuffle(set).forEach(e=>make(e,right,'R'));
  }};

/* Berpakaian Sendiri */
const gDress={id:'pakaian',name:'Berpakaian Sendiri',emoji:'👕',bg:'var(--p-sky)',
  plan:()=>shuffle(DRESS),
  build(scr,item){
    const p=el('div','prompt');p.innerHTML='Geser <span class="say">'+item.n.toUpperCase()+'</span> ke tempatnya';
    const wrap=el('div','pzwrap'),tray=el('div','pztray'),hint=el('div','pzhint','⬇️'),fig=el('div','figure');
    fig.innerHTML=CHILD_SVG;wrap.append(tray,hint,fig);scr.append(p,wrap);
    const txt=item.n+' dipakai di mana?';
    speakSoon(txt);p.onclick=()=>say(txt);
    const zoneEls={Kepala:[],Badan:[],Kaki:[]};
    fig.querySelectorAll('[data-zone]').forEach(h=>{if(zoneEls[h.dataset.zone])zoneEls[h.dataset.zone].push(h);});
    const it=el('div','dgitem',item.e);wrap.appendChild(it);
    function layout(){
      const wr=wrap.getBoundingClientRect();
      const SZ=Math.max(64,Math.min(120,Math.floor(Math.min(wr.width*.24,wr.height*.22))));
      it.style.width=SZ+'px';it.style.height=SZ+'px';
      const tr=tray.getBoundingClientRect();
      it.dataset.hx=(wr.width-SZ)/2;it.dataset.hy=(tr.top-wr.top)+Math.max(0,(tr.height-SZ)/2);
      if(!it.dataset.locked){it.style.left=it.dataset.hx+'px';it.style.top=it.dataset.hy+'px';}
    }
    function zoneRect(name){
      let l=1e9,t=1e9,r=-1e9,b=-1e9;
      zoneEls[name].forEach(h=>{const q=h.getBoundingClientRect();l=Math.min(l,q.left);t=Math.min(t,q.top);r=Math.max(r,q.right);b=Math.max(b,q.bottom);});
      return {cx:(l+r)/2,cy:(t+b)/2,w:r-l,h:b-t};
    }
    function nearZone(){
      const q=it.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2;
      let best=null,bd=1e9;
      ['Kepala','Badan','Kaki'].forEach(z=>{const zr=zoneRect(z);const dist=Math.hypot(zr.cx-cx,zr.cy-cy);if(dist<bd){bd=dist;best=z;}});
      return best;
    }
    let drag=null;
    it.addEventListener('pointerdown',e=>{if(it.dataset.locked||drag)return;it.setPointerCapture(e.pointerId);const wr=wrap.getBoundingClientRect();drag={id:e.pointerId,ox:e.clientX-(wr.left+parseFloat(it.style.left)),oy:e.clientY-(wr.top+parseFloat(it.style.top)),wr};it.classList.add('moving');it.classList.remove('gliding');sndTap();});
    it.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;it.style.left=(e.clientX-drag.wr.left-drag.ox)+'px';it.style.top=(e.clientY-drag.wr.top-drag.oy)+'px';const z=nearZone();['Kepala','Badan','Kaki'].forEach(n=>zoneEls[n].forEach(h=>h.style.fillOpacity=(n===z?'.4':'0')));});
    function up(e){
      if(!drag||(e&&e.pointerId!==drag.id))return;
      const wr=drag.wr;drag=null;it.classList.remove('moving');it.classList.add('gliding');
      const z=nearZone();['Kepala','Badan','Kaki'].forEach(n=>zoneEls[n].forEach(h=>h.style.fillOpacity='0'));
      const zr=zoneRect(z);
      const overlap=Math.abs(zr.cx-(it.getBoundingClientRect().left+it.offsetWidth/2))<zr.w*.9;
      if(z===item.t&&overlap){
        it.style.left=(zr.cx-wr.left-it.offsetWidth/2)+'px';it.style.top=(zr.cy-wr.top-it.offsetHeight/2)+'px';
        it.dataset.locked='1';hint.remove();sndSnap();burstAt(it);setTimeout(()=>Game.win(null,item.n+' di '+item.t.toLowerCase()+'! '+rnd(PRAISE)),350);
      }else{it.style.left=it.dataset.hx+'px';it.style.top=it.dataset.hy+'px';sndTry();say(item.n+' bukan di situ');}
    }
    it.addEventListener('pointerup',up);it.addEventListener('pointercancel',up);
    requestAnimationFrame(()=>{layout();requestAnimationFrame(layout);});
    window.addEventListener('resize',layout);Game.onClean(()=>window.removeEventListener('resize',layout));
  }};

const gTrace={id:'tracing',name:'Ikuti Garis',emoji:'✏️',bg:'var(--tangerine)',
  plan:()=>shuffle(TRACE_PATHS),
  build(scr,def){
    const p=el('div','prompt');p.innerHTML='Ikuti <span class="say">titik-titik</span> dengan jarimu';
    const board=el('div','board'),cv=el('canvas');board.appendChild(cv);scr.append(p,board);
    speakSoon('Ikuti titik-titiknya');
    let W,H,ctx,pts=[],hit=[],drawn=[];const color=rnd(BASIC).h;
    function setup(){const r=board.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);pts=[];for(let i=0;i<=70;i++){const q=def.f(i/70);pts.push({x:q.x*W,y:q.y*H});}hit=pts.filter((_,i)=>i%3===0).map(q=>({x:q.x,y:q.y,on:false}));redraw();}
    function redraw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(61,74,99,.12)';ctx.lineWidth=Math.max(30,W*.05);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();hit.forEach(h=>{ctx.beginPath();ctx.fillStyle=h.on?color:'rgba(61,74,99,.26)';ctx.arc(h.x,h.y,7,0,7);ctx.fill();});ctx.font=Math.max(28,W*.05)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐛',pts[0].x,pts[0].y-38);ctx.fillText('🍃',pts[pts.length-1].x,pts[pts.length-1].y-38);ctx.strokeStyle=color;ctx.lineWidth=Math.max(18,W*.03);drawn.forEach(sg=>{ctx.beginPath();sg.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();});}
    let drawing=false,cur=null;const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    function mark(q){let ch=false;hit.forEach(h=>{if(!h.on&&Math.hypot(h.x-q.x,h.y-q.y)<Math.max(40,W*.06)){h.on=true;ch=true;}});if(ch)tone(600+hit.filter(h=>h.on).length*20,.07,0,'sine',.09);if(hit.filter(h=>h.on).length/hit.length>=TRACE_NEED&&!Game.locked){const br=board.getBoundingClientRect();burst(q.x+br.left,q.y+br.top);setTimeout(()=>Game.advance(),200);}}
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drawing=true;cur=[pos(e)];drawn.push(cur);mark(cur[0]);redraw();});
    cv.addEventListener('pointermove',e=>{if(!drawing)return;const q=pos(e);cur.push(q);mark(q);redraw();});
    const stop=()=>drawing=false;cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
    const row=el('div','rowbtns');const clr=el('button','action alt','Hapus');clr.type='button';clr.onclick=()=>{sndTap();drawn=[];hit.forEach(h=>h.on=false);redraw();};const ok=el('button','action','Sudah');ok.type='button';ok.onclick=()=>{sndTap();Game.advance();};row.append(clr,ok);scr.appendChild(row);
    requestAnimationFrame(setup);
  }};
const gPaint={id:'catjari',name:'Cat Jari',emoji:'🖐️',bg:'var(--p-lilac)',
  plan:()=>shuffle(PAINT_FX),
  build(scr,fx){
    const p=el('div','prompt');p.innerHTML='Gambar dengan <span class="say">jarimu</span> '+fx.p;
    const board=el('div','board'),cv=el('canvas');board.appendChild(cv);const pal=el('div','palette');scr.append(p,board,pal);
    speakSoon('Gambar dengan jarimu');
    let W,H,ctx,cur=BASIC[0];
    function setup(){const r=board.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';}
    BASIC.concat([COLORS.find(c=>c.n==='Merah muda')]).forEach((c,i)=>{const b=el('button','pchip'+(i===0?' sel':''));b.type='button';b.style.background=c.h;b.setAttribute('aria-label',c.n);b.onclick=()=>{sndTap();say(c.n);cur=c;[...pal.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};pal.appendChild(b);});
    let down=false,last=null,cnt=0;const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    function draw(q){ctx.strokeStyle=cur.h;ctx.lineWidth=Math.max(16,W*.035);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;if(++cnt%6===0){ctx.font=Math.max(20,W*.05)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fx.p,q.x+(Math.random()-.5)*40,q.y+(Math.random()-.5)*40);tone(500+Math.random()*500,.06,0,'sine',.06);}}
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down=true;last=pos(e);draw(pos(e));});
    cv.addEventListener('pointermove',e=>{if(down)draw(pos(e));});
    const stop=()=>down=false;cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
    const row=el('div','rowbtns');const clr=el('button','action alt','Hapus');clr.type='button';clr.onclick=()=>{sndTap();ctx.clearRect(0,0,W,H);};const ok=el('button','action','Selesai');ok.type='button';ok.onclick=()=>{sndTap();Game.advance();};row.append(clr,ok);scr.appendChild(row);
    requestAnimationFrame(setup);
  }};
const gBubble={id:'gelembung',name:'Pop Bubble',emoji:'🫧',bg:'var(--p-sky)',
  plan:()=>Array.from({length:STEPS},(_,i)=>i),
  build(scr){
    const need=5;let popped=0,timer=null;
    const p=el('div','prompt');p.innerHTML='Pecahkan <span class="say">'+need+'</span> gelembung! 🫧';
    const board=el('div','board');scr.append(p,board);
    speakSoon('Pecahkan gelembungnya');
    function spawn(){
      const r=board.getBoundingClientRect();if(!r.width)return;
      const it=rnd(BUBBLE_POOL);
      const size=Math.max(74,Math.min(150,Math.floor(Math.min(r.width,r.height)*.28)));
      const b=el('button','bub');b.type='button';
      b.style.width=size+'px';b.style.height=size+'px';b.style.left=Math.floor(Math.random()*Math.max(1,r.width-size))+'px';b.style.top=Math.floor(Math.random()*Math.max(1,r.height-size))+'px';b.style.fontSize=size+'px';
      const sk=el('div','sk');sk.style.background='radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), '+it.color+' 72%)';
      const ic=el('div','ic',it.t==='warna'?'':it.ic);b.append(sk,ic);
      b.onclick=()=>{if(b.dataset.gone)return;b.dataset.gone='1';sndPop();burstAt(b);say(it.lbl);b.classList.add('gone');setTimeout(()=>b.remove(),320);popped++;if(popped>=need){clearInterval(timer);setTimeout(()=>Game.advance(),600);}};
      board.appendChild(b);setTimeout(()=>{if(!b.dataset.gone)b.remove();},4200);
    }
    requestAnimationFrame(()=>{for(let i=0;i<3;i++)setTimeout(spawn,i*260);});
    timer=setInterval(spawn,900);Game.onClean(()=>clearInterval(timer));
  }};
const gScrub=makeScrub({id:'bersih',name:'Bersihkan Kotoran',emoji:'🧽',bg:'var(--clay)',data:SCRUB.filter(s=>s.mode==='clean'),winWord:()=>'Bersih! '+rnd(PRAISE)});
const gSand=makeScrub({id:'pasir',name:'Cari di Pasir',emoji:'🏖️',bg:'var(--sand)',data:SCRUB.filter(s=>s.mode==='sand'),winWord:()=>'Ketemu! '+rnd(PRAISE)});

const GROUPS=[
  {t:'📚 Belajar',items:[gColor,gCount,gShape,gLetter,gAnimal,gSound,gFeed,gBaby,gVehicle,gJob,gHome,gEdible,gCategory,gOdd,gEmotion,gRoutine,gInstruct,gBody,gPairs,gPattern]},
  {t:'🧩 Main & Susun',items:[gPuzzle,gMatch,gPlace,gSort,gShadow,gDress]},
  {t:'🎨 Sensori & Gerak',items:[gTrace,gPaint,gBubble,gScrub,gSand]}
];

function goHome(){
  clearTimeout(Game.timer);Game.clean();
  if(ttsOn)try{speechSynthesis.cancel();}catch(e){}
  Game.locked=false;bar.classList.add('hidden');stage.innerHTML='';
  const s=el('div','screen'),brand=el('div','brand');
  brand.appendChild(el('h1',null,'Taman Belajar'));
  brand.appendChild(el('div','subtitle','🌈 Sentuh gambar untuk mulai bermain'));
  const sc=el('div','scroller');
  GROUPS.forEach(gr=>{
    sc.appendChild(el('div','sect',gr.t));
    const g=el('div','grid');
    gr.items.forEach(a=>{const c=el('button','card');c.type='button';c.style.background=a.bg;c.innerHTML='<div class="em">'+a.emoji+'</div><div class="nm">'+a.name+'</div>';c.onclick=()=>{ac();sndTap();say(a.name);Game.open(a);};g.appendChild(c);});
    sc.appendChild(g);
  });
  sc.appendChild(el('div','tip','Untuk orang tua: setiap permainan berisi 10 langkah. Saat bermain, tahan tombol 🏠 selama 1 detik untuk kembali ke menu ini.'));
  s.append(brand,sc);stage.appendChild(s);
}

const homeBtn=document.getElementById('home');
let holdT=null,held=false;
homeBtn.addEventListener('pointerdown',e=>{e.preventDefault();held=false;homeBtn.classList.add('holding');tone(420,.1,0,'sine',.08);holdT=setTimeout(()=>{held=true;homeBtn.classList.remove('holding');sndTap();goHome();},1000);});
function holdCancel(){clearTimeout(holdT);homeBtn.classList.remove('holding');}
homeBtn.addEventListener('pointerup',()=>{holdCancel();if(!held)toast('Tahan tombol 🏠 selama 1 detik untuk kembali');});
homeBtn.addEventListener('pointerleave',holdCancel);
homeBtn.addEventListener('pointercancel',holdCancel);

document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
goHome();
</script>
