<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF8A1F">
<title>Taman Belajar</title>
<style>
:root{
  --ink:#12263F;
  /* satu tona terang: mangga */
  --hi:#FF8A1F;
  --hi-lite:#FFC24A;
  --hi-deep:#E86A00;

  --strawberry:#FF4D6D;
  --sun:#FFC42E;
  --sky:#2FA9E8;
  --leaf:#35C47C;
  --grape:#8B62E8;
  --tangerine:#FF8A3D;
  --bubble:#5AC8D8;
  --rose:#EF6FA5;
  --shadow:0 10px 0 rgba(18,38,63,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Baloo 2","Comic Sans MS","Segoe UI Rounded",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,138,31,.20), transparent 44%),
    radial-gradient(circle at 88% 84%, rgba(47,169,232,.20), transparent 46%),
    #EAF6F1;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- bilah atas ---------- */
#bar{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
#bar.hidden{display:none}
.iconbtn{
  position:relative;overflow:hidden;border:0;border-radius:22px;
  background:var(--strawberry);color:#fff;
  box-shadow:0 5px 0 rgba(18,38,63,.22);min-width:150px;height:58px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:none;
  font-family:inherit;font-weight:900;font-size:22px;touch-action:none;
}
.iconbtn .fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:rgba(255,255,255,.42);transition:width .18s ease;
}
.iconbtn.holding .fill{width:100%;transition:width 1s linear}
.iconbtn .lab{position:relative;display:flex;align-items:center;gap:8px}
.iconbtn .sub{font-size:13px;opacity:.9;font-weight:800}
.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(18,38,63,.22)}
#dots{display:flex;gap:9px;flex:1;justify-content:center}
.dot{width:20px;height:20px;border-radius:50%;background:rgba(18,38,63,.14)}
.dot.on{background:var(--sun);box-shadow:0 0 0 4px rgba(255,196,46,.30)}
#scorepill{
  background:var(--sun);border-radius:22px;box-shadow:0 5px 0 rgba(18,38,63,.22);
  padding:12px 20px;font-size:24px;font-weight:900;white-space:nowrap
}

/* toast */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-weight:800;font-size:17px;
  padding:14px 24px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;z-index:70;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- panggung ---------- */
#stage{flex:1;position:relative;display:flex;flex-direction:column;padding:0 16px 18px;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;animation:fadeUp .35s ease both;min-height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- beranda ---------- */
.brand{text-align:center;padding:6px 0 10px}
.brand h1{
  margin:0;font-weight:900;line-height:1.02;letter-spacing:1.5px;
  font-size:clamp(38px,8.6vw,74px);
  background:linear-gradient(180deg,var(--hi-lite) 0%,var(--hi) 52%,var(--hi-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  filter:drop-shadow(0 6px 0 rgba(18,38,63,.26));
}
.subtitle{
  display:inline-block;margin:14px auto 0;background:var(--hi-lite);color:var(--ink);
  border-radius:999px;padding:10px 24px;font-size:clamp(15px,2.7vw,21px);font-weight:900;
  box-shadow:0 5px 0 rgba(18,38,63,.22);border:3px solid var(--hi);
}
.grid{
  flex:1;display:grid;gap:14px;overflow-y:auto;padding:14px 0 6px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  align-content:start;
}
.card{
  border:0;border-radius:32px;color:#fff;cursor:pointer;
  min-height:132px;padding:14px 10px 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);
  transition:transform .12s ease;font-family:inherit;
}
.card:active{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 rgba(18,38,63,.20)}
.card .em{font-size:clamp(38px,7vw,58px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.card .nm{font-size:clamp(16px,2.6vw,22px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tip{
  margin:12px auto 0;background:var(--hi);color:var(--ink);border-radius:22px;
  padding:13px 22px;text-align:center;font-size:clamp(14px,2.2vw,18px);font-weight:900;
  line-height:1.4;box-shadow:0 5px 0 rgba(18,38,63,.22);max-width:760px;
  border:3px solid var(--hi-deep);
}

/* ---------- pertanyaan + pilihan ---------- */
.prompt{
  background:#fff;border-radius:28px;box-shadow:var(--shadow);
  padding:16px 22px;margin:2px 0 16px;text-align:center;
  font-size:clamp(22px,4.4vw,38px);font-weight:900;line-height:1.25;
}
.prompt .say{color:var(--hi-deep)}
.answers{
  flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:18px;align-content:center;min-height:0;
}
.opt{
  border:0;background:#fff;border-radius:34px;box-shadow:var(--shadow);cursor:pointer;
  width:clamp(126px,25vw,210px);height:clamp(126px,25vw,210px);
  display:grid;place-items:center;font-size:clamp(54px,11.5vw,98px);
  transition:transform .12s ease;padding:0;font-family:inherit;
}
.opt:active{transform:translateY(5px) scale(.96)}
.opt.stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.opt .lbl{font-size:clamp(15px,2.4vw,21px);font-weight:900;margin-top:4px}
.swatch{border-radius:50%;width:clamp(126px,25vw,200px);height:clamp(126px,25vw,200px);box-shadow:var(--shadow)}
.wobble{animation:wob .45s ease}
@keyframes wob{0%,100%{transform:none}20%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.float{animation:flt 2.6s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.tray{
  background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:16px;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:16px
}
.tray span{font-size:clamp(40px,8.5vw,76px);line-height:1}

/* ---------- mencocokkan ---------- */
.matchwrap{flex:1;display:flex;gap:16px;align-items:center;justify-content:center;min-height:0}
.col{display:flex;flex-direction:column;gap:16px}
.mitem{
  border:0;background:#fff;border-radius:28px;box-shadow:var(--shadow);
  width:clamp(100px,19vw,156px);height:clamp(100px,19vw,156px);
  font-size:clamp(46px,9.5vw,82px);display:grid;place-items:center;cursor:pointer;font-family:inherit
}
.mitem.sel{outline:6px solid var(--sun);transform:scale(1.05)}
.mitem.done{background:var(--leaf);opacity:.5;pointer-events:none}

/* ---------- puzzle (geser) ---------- */
.pzwrap{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0;padding:6px 0 4px}
.pztray{width:100%;display:flex;align-items:center;justify-content:center}
.pzhint{font-size:clamp(26px,5vw,40px);opacity:.5;animation:down 1.6s ease-in-out infinite}
@keyframes down{0%,100%{transform:translateY(-4px)}50%{transform:translateY(8px)}}
.slots{display:grid;gap:8px;background:#fff;padding:10px;border-radius:26px;box-shadow:var(--shadow)}
.slot{border-radius:14px;background:rgba(18,38,63,.08)}
.slot.ready{background:rgba(255,196,46,.5)}
.ptile{
  position:absolute;border-radius:14px;overflow:hidden;background:#fff;line-height:0;
  box-shadow:var(--shadow);touch-action:none;cursor:grab;
}
.ptile.moving{transition:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 16px 0 rgba(18,38,63,.20);z-index:20}
.ptile.gliding{transition:left .28s cubic-bezier(.3,1.3,.5,1), top .28s cubic-bezier(.3,1.3,.5,1)}
.ptile.locked{box-shadow:none}
.ptile canvas{display:block;width:100%;height:100%}

/* ---------- balon & papan ---------- */
.board{flex:1;background:#fff;border-radius:34px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:0}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.balloon{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.balloon .body{
  width:100%;height:100%;border-radius:50% 50% 46% 46% / 58% 58% 44% 44%;
  box-shadow:inset -12px -14px 0 rgba(0,0,0,.10), 0 6px 0 rgba(18,38,63,.12);position:relative;
}
.balloon .body::after{
  content:"";position:absolute;left:50%;bottom:-34%;width:4px;height:34%;
  background:rgba(18,38,63,.35);transform:translateX(-50%);border-radius:4px;
}
.balloon .body::before{
  content:"";position:absolute;left:22%;top:16%;width:22%;height:16%;
  background:rgba(255,255,255,.55);border-radius:50%;
}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(8px) rotate(2deg)}}
.popped{animation:popout .28s ease forwards}
@keyframes popout{to{transform:scale(1.5);opacity:0}}

.action{
  border:0;border-radius:26px;background:var(--leaf);color:#fff;font-weight:900;
  font-size:clamp(18px,3vw,26px);padding:16px 30px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit
}
.action.alt{background:var(--sky)}
.action:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(18,38,63,.20)}
.rowbtns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* ---------- selesai ---------- */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.finish .trophy{font-size:clamp(90px,22vw,180px)}
.finish h2{
  font-size:clamp(28px,6vw,50px);margin:0;font-weight:900;color:var(--hi);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
}
.finish .stars{font-size:clamp(30px,7vw,54px);letter-spacing:6px}

.burst{position:fixed;pointer-events:none;font-size:36px;z-index:60;animation:fly .9s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
#flash{position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,0);z-index:50}
#flash.on{animation:fl .5s ease}
@keyframes fl{0%{background:rgba(255,255,255,.55)}100%{background:rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar" class="hidden">
    <button class="iconbtn" id="home" type="button" aria-label="Tahan satu detik untuk kembali ke menu">
      <span class="fill"></span>
      <span class="lab">🏠 Menu <span class="sub">tahan</span></span>
    </button>
    <div id="dots"></div>
    <div id="scorepill">⭐ <span id="score">0</span></div>
  </div>
  <div id="stage"></div>
</div>
<div id="flash"></div>
<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   Taman Belajar v3 — belajar offline untuk usia 3 tahun
   Satu berkas. Tanpa framework. Tanpa aset eksternal.
   ========================================================= */

const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const dotsEl=document.getElementById('dots');
const scoreEl=document.getElementById('score');
const flash=document.getElementById('flash');
const toastEl=document.getElementById('toast');

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const sample=(a,n)=>shuffle(a).slice(0,n);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

/* setelan tetap untuk usia 3 tahun */
const N_OPT=3, N_ROUND=5, N_PAIR=3, N_PIECE=4, N_BALLOON=8, TRACE_NEED=.80;

let toastT=null;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2200);
}

/* ---------- SUARA (Web Audio, sepenuhnya offline) ---------- */
let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function tone(freq,dur,delay=0,type='sine',vol=.22){
  const c=ac();if(!c)return;
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
const sndGood  =()=>[523,659,784,1047].forEach((f,i)=>tone(f,.35,i*.09,'triangle',.2));
const sndTry   =()=>{tone(300,.18,0,'sine',.15);tone(240,.22,.12,'sine',.13);};
const sndTap   =()=>tone(680,.09,0,'sine',.12);
const sndSnap  =()=>{tone(520,.09,0,'square',.12);tone(880,.14,.05,'triangle',.16);};
const sndPop   =()=>{tone(1100,.05,0,'square',.16);tone(420,.12,.03,'triangle',.14);};
const sndFinish=()=>[523,587,659,784,880,1047,1319].forEach((f,i)=>tone(f,.4,i*.11,'triangle',.19));

/* ---------- SUARA BICARA (opsional) ---------- */
let voiceID=null,ttsOn=('speechSynthesis' in window);
function pickVoice(){
  if(!ttsOn)return;
  const v=speechSynthesis.getVoices();
  voiceID=v.find(x=>/^id/i.test(x.lang))||v.find(x=>/^ms/i.test(x.lang))||null;
}
if(ttsOn){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){
  if(!ttsOn)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID';u.rate=.88;u.pitch=1.25;if(voiceID)u.voice=voiceID;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- EFEK ---------- */
const PRAISE=['Hebat!','Pintar!','Bagus sekali!','Yeay, benar!','Keren!','Kamu bisa!'];
function burst(x,y){
  const ch=['⭐','✨','🌟','💫','🎉'];
  for(let i=0;i<10;i++){
    const s=el('div','burst',rnd(ch));
    const a=Math.random()*Math.PI*2,d=90+Math.random()*140;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d-40)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);
  }
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
}
function burstAt(n){const r=n.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);}

/* ---------- DATA ---------- */
const COLORS=[
  {n:'Merah',h:'#FF4D6D'},{n:'Biru',h:'#2FA9E8'},{n:'Kuning',h:'#FFC42E'},
  {n:'Hijau',h:'#35C47C'},{n:'Oranye',h:'#FF8A3D'},{n:'Ungu',h:'#8B62E8'},
  {n:'Merah muda',h:'#FF9EC4'},{n:'Cokelat',h:'#A9714B'}
];
const ANIMALS=[
  {n:'Kucing',e:'🐱',s:'Meong meong'},{n:'Anjing',e:'🐶',s:'Guk guk'},
  {n:'Sapi',e:'🐮',s:'Moooo'},{n:'Bebek',e:'🦆',s:'Kwek kwek'},
  {n:'Ayam',e:'🐔',s:'Petok petok'},{n:'Kambing',e:'🐐',s:'Mbeeek'},
  {n:'Ikan',e:'🐟',s:'Blub blub'},{n:'Gajah',e:'🐘',s:'Tuuuut'},
  {n:'Monyet',e:'🐵',s:'Uu aa uu aa'},{n:'Kelinci',e:'🐰',s:'Hop hop'}
];
const SHAPES=[
  {n:'Lingkaran',svg:'<circle cx="50" cy="50" r="38"/>'},
  {n:'Persegi',svg:'<rect x="14" y="14" width="72" height="72" rx="8"/>'},
  {n:'Segitiga',svg:'<polygon points="50,10 92,88 8,88"/>'},
  {n:'Bintang',svg:'<polygon points="50,6 62,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 38,38"/>'},
  {n:'Hati',svg:'<path d="M50 88C20 66 8 50 8 34 8 20 19 10 32 10c8 0 15 4 18 10 3-6 10-10 18-10 13 0 24 10 24 24 0 16-12 32-42 54z"/>'},
  {n:'Oval',svg:'<ellipse cx="50" cy="50" rx="42" ry="28"/>'}
];
const EMOTIONS=[
  {n:'Senang',e:'😊'},{n:'Sedih',e:'😢'},{n:'Marah',e:'😠'},
  {n:'Terkejut',e:'😲'},{n:'Ngantuk',e:'😴'},{n:'Takut',e:'😨'}
];
const ROUTINE=[
  {q:'Bangun tidur, lalu apa?',a:{n:'Sikat gigi',e:'🪥'},w:[{n:'Tidur lagi',e:'😴'},{n:'Main bola',e:'⚽'}]},
  {q:'Sebelum makan, kita apa?',a:{n:'Cuci tangan',e:'🧼'},w:[{n:'Nonton',e:'📺'},{n:'Lompat',e:'🤸'}]},
  {q:'Badan kotor, kita apa?',a:{n:'Mandi',e:'🛁'},w:[{n:'Makan kue',e:'🧁'},{n:'Menggambar',e:'🖍️'}]},
  {q:'Perut lapar, kita apa?',a:{n:'Makan',e:'🍚'},w:[{n:'Pakai sepatu',e:'👟'},{n:'Membaca',e:'📖'}]},
  {q:'Sudah malam, kita apa?',a:{n:'Tidur',e:'🛏️'},w:[{n:'Lari',e:'🏃'},{n:'Renang',e:'🏊'}]},
  {q:'Selesai main, mainan?',a:{n:'Dirapikan',e:'🧺'},w:[{n:'Dilempar',e:'💥'},{n:'Dimakan',e:'🍽️'}]},
  {q:'Mau keluar rumah, pakai?',a:{n:'Sepatu',e:'👟'},w:[{n:'Bantal',e:'🛏️'},{n:'Sendok',e:'🥄'}]}
];
const COUNT_ITEMS=['🍎','🐤','🎈','🍌','🐞','🌼','🚗','⭐'];
const PUZZLE_PICS=['🦋','🐢','🚂','🍉','🐳','🌻','🚕','🦖','🐸','🍓'];
const MATCH_SETS=[['🍎','🍌','🐟'],['🚗','🌸','🐶'],['⚽','🐤','🍓'],['🌙','🐘','🍇'],['🎈','🐮','🍊']];

/* ---------- MESIN PERMAINAN ---------- */
const Game={
  act:null,round:0,total:N_ROUND,stars:0,locked:false,timer:null,
  open(a){
    this.act=a;this.round=0;this.stars=0;this.total=N_ROUND;
    bar.classList.remove('hidden');scoreEl.textContent='0';this.next();
  },
  dots(){
    dotsEl.innerHTML='';
    for(let i=0;i<this.total;i++)dotsEl.appendChild(el('div','dot'+(i<this.round?' on':'')));
  },
  next(){
    this.locked=false;this.dots();
    if(this.round>=this.total){this.finish();return;}
    stage.innerHTML='';
    const s=el('div','screen');stage.appendChild(s);
    this.act.build(s,this.round);
  },
  win(node,words){
    if(this.locked)return;this.locked=true;
    if(node){node.classList.add('pop');burstAt(node);}
    sndGood();say(words||rnd(PRAISE));
    this.stars++;this.round++;scoreEl.textContent=this.stars;
    this.timer=setTimeout(()=>this.next(),1500);
  },
  wrong(node,hint){
    if(this.locked)return;
    if(node){node.classList.remove('wobble');void node.offsetWidth;node.classList.add('wobble');}
    sndTry();if(hint)say(hint);
  },
  advance(){this.win(null);},
  finish(){
    stage.innerHTML='';
    const s=el('div','screen'),f=el('div','finish');
    f.appendChild(el('div','trophy float','🏆'));
    f.appendChild(el('h2',null,'Selesai! Kamu hebat!'));
    f.appendChild(el('div','stars','⭐'.repeat(Math.max(1,this.stars))));
    const row=el('div','rowbtns');
    const again=el('button','action','Main lagi');again.type='button';
    again.onclick=()=>{sndTap();this.open(this.act);};
    const menu=el('button','action alt','Menu');menu.type='button';
    menu.onclick=()=>{sndTap();goHome();};
    row.append(again,menu);f.appendChild(row);s.appendChild(f);stage.appendChild(s);
    sndFinish();say('Hore! Selesai. Kamu hebat!');
    const cx=innerWidth/2,cy=innerHeight/2;
    for(let i=0;i<4;i++)setTimeout(()=>burst(cx+(Math.random()-.5)*260,cy+(Math.random()-.5)*200),i*260);
  }
};

function askScreen(scr,html,speakText){
  const p=el('div','prompt');p.innerHTML=html;
  const ans=el('div','answers');scr.append(p,ans);
  if(speakText)setTimeout(()=>say(speakText),260);
  p.onclick=()=>{if(speakText)say(speakText);};
  return ans;
}

/* 5. MENELUSURI */
const TRACE_PATHS=[
  {n:'garis',f:t=>({x:.12+.76*t,y:.5})},
  {n:'bukit',f:t=>({x:.12+.76*t,y:.5-.3*Math.sin(Math.PI*t)})},
  {n:'ombak',f:t=>({x:.12+.76*t,y:.5+.22*Math.sin(Math.PI*4*t)})},
  {n:'lingkaran',f:t=>({x:.5+.32*Math.cos(2*Math.PI*t-Math.PI/2),y:.5+.36*Math.sin(2*Math.PI*t-Math.PI/2)})},
  {n:'zigzag',f:t=>({x:.12+.76*t,y:.5+.26*(Math.abs(((t*4)%2)-1)*2-1)})}
];
const actTrace={id:'tracing',name:'Menelusuri',emoji:'✏️',bg:'var(--tangerine)',
  build(scr,round){
    const def=TRACE_PATHS[round%TRACE_PATHS.length];
    const p=el('div','prompt');p.innerHTML='Ikuti <span class="say">titik-titik</span> dengan jarimu';
    const board=el('div','board');const cv=el('canvas');board.appendChild(cv);
    scr.append(p,board);
    setTimeout(()=>say('Ikuti titik-titiknya dengan jarimu'),260);
    let W,H,ctx,pts=[],hit=[],drawn=[];
    const color=rnd(COLORS).h;
    function setup(){
      const r=board.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
      W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
      ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
      pts=[];for(let i=0;i<=60;i++){const q=def.f(i/60);pts.push({x:q.x*W,y:q.y*H});}
      hit=pts.filter((_,i)=>i%3===0).map(q=>({x:q.x,y:q.y,on:false}));
      redraw();
    }
    function redraw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='rgba(18,38,63,.13)';ctx.lineWidth=Math.max(30,W*.05);ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();
      hit.forEach(h=>{ctx.beginPath();ctx.fillStyle=h.on?color:'rgba(18,38,63,.28)';ctx.arc(h.x,h.y,7,0,7);ctx.fill();});
      ctx.font=Math.max(28,W*.05)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🐛',pts[0].x,pts[0].y-38);
      ctx.fillText('🍃',pts[pts.length-1].x,pts[pts.length-1].y-38);
      ctx.strokeStyle=color;ctx.lineWidth=Math.max(18,W*.03);
      drawn.forEach(sg=>{ctx.beginPath();sg.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();});
    }
    let drawing=false,cur=null;
    const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    function mark(q){
      let ch=false;
      hit.forEach(h=>{if(!h.on&&Math.hypot(h.x-q.x,h.y-q.y)<Math.max(40,W*.06)){h.on=true;ch=true;}});
      if(ch)tone(600+hit.filter(h=>h.on).length*22,.07,0,'sine',.09);
      if(hit.filter(h=>h.on).length/hit.length>=TRACE_NEED&&!Game.locked){
        const br=board.getBoundingClientRect();burst(q.x+br.left,q.y+br.top);
        setTimeout(()=>Game.advance(),200);
      }
    }
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drawing=true;cur=[pos(e)];drawn.push(cur);mark(cur[0]);redraw();});
    cv.addEventListener('pointermove',e=>{if(!drawing)return;const q=pos(e);cur.push(q);mark(q);redraw();});
    const stop=()=>drawing=false;
    cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
    const row=el('div','rowbtns');
    const clr=el('button','action alt','Hapus');clr.type='button';
    clr.onclick=()=>{sndTap();drawn=[];hit.forEach(h=>h.on=false);redraw();};
    const ok=el('button','action','Sudah!');ok.type='button';
    ok.onclick=()=>{sndTap();Game.advance();};
    row.append(clr,ok);scr.appendChild(row);
    requestAnimationFrame(setup);
  }};

/* 6. PUZZLE — geser potongan ke bawah */
const actPuzzle={id:'puzzle',name:'Puzzle',emoji:'🧩',bg:'var(--sun)',
  build(scr){
    const pic=rnd(PUZZLE_PICS),n=N_PIECE,cols=2,rows=2;
    const p=el('div','prompt');p.innerHTML='Geser potongan ke <span class="say">bawah</span> '+pic;
    const wrap=el('div','pzwrap'),tray=el('div','pztray'),hint=el('div','pzhint','⬇️'),slots=el('div','slots');
    slots.style.gridTemplateColumns='repeat('+cols+',1fr)';
    wrap.append(tray,hint,slots);scr.append(p,wrap);
    setTimeout(()=>say('Geser potongannya ke tempatnya'),260);

    const S=320,src=document.createElement('canvas');src.width=S;src.height=S;
    const sc=src.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,S,S);
    sc.font=Math.floor(S*.82)+'px serif';sc.textAlign='center';sc.textBaseline='middle';
    sc.fillText(pic,S/2,S/2+S*.04);

    let TS=100,tiles=[],slotEls=[],placed=0;
    for(let i=0;i<n;i++){const d=el('div','slot');d.dataset.i=i;slots.appendChild(d);slotEls.push(d);}
    shuffle([...Array(n).keys()]).forEach(i=>{
      const b=el('div','ptile');b.dataset.i=i;
      const c=document.createElement('canvas');c.width=160;c.height=160;
      const sw=S/cols,sh=S/rows;
      c.getContext('2d').drawImage(src,(i%cols)*sw,Math.floor(i/cols)*sh,sw,sh,0,0,160,160);
      b.appendChild(c);wrap.appendChild(b);tiles.push(b);
    });

    function layout(){
      const wr=wrap.getBoundingClientRect();
      TS=Math.max(64,Math.min(118,Math.floor(Math.min(wr.width/(n+1.4),wr.height*.25))));
      slotEls.forEach(d=>{d.style.width=TS+'px';d.style.height=TS+'px';});
      const trayR=tray.getBoundingClientRect();
      const free=tiles.filter(t=>!t.dataset.locked);
      const gap=14,totalW=free.length*TS+(free.length-1)*gap;
      let x=(wr.width-totalW)/2;
      free.forEach(t=>{
        t.style.width=TS+'px';t.style.height=TS+'px';
        t.dataset.hx=x;t.dataset.hy=(trayR.top-wr.top)+Math.max(0,(trayR.height-TS)/2);
        t.style.left=t.dataset.hx+'px';t.style.top=t.dataset.hy+'px';
        x+=TS+gap;
      });
      tiles.filter(t=>t.dataset.locked).forEach(t=>{
        const d=slotEls[+t.dataset.i].getBoundingClientRect();
        t.style.width=TS+'px';t.style.height=TS+'px';
        t.style.left=(d.left-wr.left)+'px';t.style.top=(d.top-wr.top)+'px';
      });
    }

    let drag=null;
    function down(e){
      const t=e.currentTarget;if(t.dataset.locked||drag)return;   /* satu jari saja */
      t.setPointerCapture(e.pointerId);
      const wr=wrap.getBoundingClientRect();
      drag={t,id:e.pointerId,ox:e.clientX-(wr.left+parseFloat(t.style.left)),oy:e.clientY-(wr.top+parseFloat(t.style.top)),wr};
      t.classList.add('moving');t.classList.remove('gliding');sndTap();
    }
    function move(e){
      if(!drag||e.pointerId!==drag.id)return;
      const {t,wr}=drag;
      t.style.left=(e.clientX-wr.left-drag.ox)+'px';
      t.style.top=(e.clientY-wr.top-drag.oy)+'px';
      const near=nearestSlot(t);
      slotEls.forEach((d,i)=>d.classList.toggle('ready',near!=null&&i===near));
    }
    function nearestSlot(t){
      const r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      let best=null,bd=1e9;
      slotEls.forEach((d,i)=>{
        if(d.dataset.full)return;
        const s=d.getBoundingClientRect();
        const dist=Math.hypot(s.left+s.width/2-cx,s.top+s.height/2-cy);
        if(dist<bd){bd=dist;best=i;}
      });
      return bd<TS*1.15?best:null;
    }
    function up(e){
      if(!drag||(e&&e.pointerId!==drag.id))return;
      const {t,wr}=drag;drag=null;
      t.classList.remove('moving');t.classList.add('gliding');
      slotEls.forEach(d=>d.classList.remove('ready'));
      const near=nearestSlot(t),mine=+t.dataset.i;
      if(near===mine){
        const d=slotEls[mine].getBoundingClientRect();
        t.style.left=(d.left-wr.left)+'px';t.style.top=(d.top-wr.top)+'px';
        t.dataset.locked='1';t.classList.add('locked');slotEls[mine].dataset.full='1';
        sndSnap();burstAt(t);placed++;
        setTimeout(layout,320);
        if(placed===n){hint.remove();setTimeout(()=>Game.advance(),450);}
      }else{
        t.style.left=t.dataset.hx+'px';t.style.top=t.dataset.hy+'px';
        sndTry();say('Coba tempat yang lain');
      }
    }
    tiles.forEach(t=>{
      t.addEventListener('pointerdown',down);
      t.addEventListener('pointermove',move);
      t.addEventListener('pointerup',up);
      t.addEventListener('pointercancel',up);
    });
    requestAnimationFrame(()=>{layout();requestAnimationFrame(layout);});
    window.addEventListener('resize',layout);
  }};

const actMatch={id:'cocok',name:'Mencocokkan',emoji:'🔗',bg:'var(--bubble)',
  build(scr,round){
    const set=MATCH_SETS[round%MATCH_SETS.length].slice(0,N_PAIR);

    const wrap=el('div','matchwrap'),left=el('div','col'),right=el('div','col');
    wrap.append(left,right);scr.append(p,wrap);
    setTimeout(()=>say('Cocokkan gambar yang sama'),260);
    let sel=null,done=0;
    const make=(e,col)=>{const b=el('button','mitem',e);b.type='button';b.dataset.e=e;col.appendChild(b);return b;};
    shuffle(set).forEach(e=>{const b=make(e,left);
      b.onclick=()=>{sndTap();[...left.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;};});
    shuffle(set).forEach(e=>{const b=make(e,right);

        if(sel.dataset.e===b.dataset.e){
          sel.classList.add('done');b.classList.add('done');sel.classList.remove('sel');
          tone(780,.15,0,'triangle',.16);burstAt(b);sel=null;done++;
          if(done===set.length)setTimeout(()=>Game.advance(),400);
        }else Game.wrong(b,'Belum sama, coba lagi');
      };});
  }};
